name: CI

# すべてのブランチの push で検査とテストを走らせ、main に入ったものだけを GitHub Pages に公開する
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静的な検査（lint・型）と、unit / integration テスト（カバレッジの基準つき）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: 本番向け（VITE_USE_MOCK=false）のビルドに開発用の機能が残っていないか
        run: npm run check:no-mock-build
      # 適用済みのマイグレーションを書き換えていないか、when の順番、危ない ALTER（docs/production.md）。
      # 基準は、ブランチなら main、main への push なら push 前のコミット
      - name: マイグレーションを確かめる
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=main
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then base="$BEFORE"; fi
          git fetch --no-tags --depth=1 origin "$base"
          npx drizzle-kit check
          node scripts/check-migrations.mjs FETCH_HEAD
      - run: npm run test:coverage
      - name: カバレッジのレポートを残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # 結合テストを、本番（Aurora PostgreSQL 18）と同じメジャーバージョンの PostgreSQL でも流す。
  # check の結合テストは PGlite（ブラウザと同じ WASM 版）。こちらは node-postgres → 本物のサーバー（src/test/db.ts）
  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  # ビルドしたアプリを Chromium で操作する（デスクトップとスマートフォン）
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 失敗したときのレポート（スクリーンショット・トレース）を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    needs: [check, integration-postgres, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # https://<user>.github.io/<repo>/ で配信されるので、リポジトリ名をベースパスにする。
          # 直接開いた URL（/projects/1 など）は Pages が 404.html を返すので、build で index.html を複製しておく
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
